name: Django Tests

on:
    pull_request:
        types: [opened, reopened, synchronize]
        branches:
            - main

jobs:
    django-tests:
        name: Django CI
        runs-on: ubuntu-latest

        steps:
            - name: Free up space
              run: |
                  echo "Cleaning up temporary files to free up space..."
                  sudo rm -rf /tmp/* /var/tmp/*
                  sudo apt-get clean
                  df -h  # optional: check disk usage
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r mysite/requirements.txt

            - name: Run migrations
              run: |
                  cd mysite
                  python manage.py migrate

            - name: Run tests
              run: |
                  cd mysite
                  python manage.py test
