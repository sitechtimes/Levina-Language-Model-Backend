name: Linting

on:
    pull_request:
        types: [opened, reopened, synchronize]
        branches:
            - main

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Free up space
              run: |
                  echo "Cleaning up temporary files to free up space"
                  sudo rm -rf /tmp/* /var/tmp/*
                  sudo apt-get clean
                  df -h  # optional: check disk usage

            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.11'

            - name: Install Ruff
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff

            - name: Run Ruff
              run: |
                  ruff check . --fix
